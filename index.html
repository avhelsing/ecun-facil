<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECUN Fácil · Librería</title><style>
:root{font-family:Arial,sans-serif;color:#192d39;background:#f6f5f0;font-size:20px}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #d7ddd9;display:flex;align-items:center;justify-content:space-between;background:white;gap:18px}.brand{font-size:30px;font-weight:800}.brand small{display:block;font-size:15px;font-weight:400;margin-top:6px;color:#53636b}.badge{font-size:15px;border:1px solid #cad5cc;padding:10px 16px;border-radius:30px;color:#37604b}main{max-width:1200px;margin:auto;padding:40px 28px}h1{font-size:40px;margin:12px 0}h2{font-size:27px}p{line-height:1.5}.muted{color:#52626c}.eyebrow{font-size:14px;font-weight:bold;letter-spacing:2px;color:#566b61}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:36px 0}.tile{border:0;border-radius:18px;padding:32px;text-align:left;color:white;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 15px #122b3610}.tile strong{font-size:30px;display:block;margin:20px 0 10px}.tile span{font-size:18px;line-height:1.45}.blue{background:#1859a0;color:white}.green{background:#25694c;color:white}.orange{background:#98501a;color:white}.icon{font-size:40px}button{font:inherit;font-weight:600;cursor:pointer;border:1px solid #cbd4d7;background:white;color:inherit;border-radius:10px;padding:16px 22px;min-height:58px}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #db9d29;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#1859a0;color:white;border-color:#1859a0}.success{background:#25694c;color:white;border-color:#25694c}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.panel{background:white;border:1px solid #dbe0db;border-radius:16px;padding:26px;margin:22px 0}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.stat{font-size:36px;font-weight:bold;margin:12px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:17px 10px;border-bottom:1px solid #e1e5e3}th{font-size:15px;color:#53636b}label{display:block;font-weight:600;margin:18px 0 8px}input,select{font:inherit;padding:16px;border:1px solid #9aaab2;border-radius:8px;width:100%;background:white;color:#192d39}.hint{font-size:16px;color:#53636b}.total{font-size:38px;font-weight:bold}.notice{padding:18px 22px;border-left:4px solid #2e6c51;background:#eaf2ec;border-radius:6px;margin:20px 0;line-height:1.5}.empty{padding:38px 0;text-align:center;color:#53636b}.small{font-size:16px;min-height:46px;padding:10px 14px}.danger{color:#9d3030}.nav{margin-bottom:24px}footer{max-width:1144px;margin:20px auto;padding:20px 28px;border-top:1px solid #d7ddd9;font-size:15px;color:#53636b}dialog{border:0;border-radius:18px;width:min(600px,94vw);padding:30px;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#162a3980}#toast:empty{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#192d39;color:white;padding:20px 26px;border-radius:12px;z-index:5;max-width:90vw}.actions{margin-top:24px}.report-tabs button[aria-pressed=true]{background:#192d39;color:white}@media(max-width:800px){.grid,.two,.three{grid-template-columns:1fr}.tile{min-height:190px}.grid{margin-top:24px}h1{font-size:32px}header{padding:20px}.badge{display:none}main{padding:25px 18px}.panel{padding:18px}td{font-size:17px}}@media print{header,footer,.nav,.no-print,#toast{display:none!important}body{background:white}main{padding:0}dialog[open]{position:static;box-shadow:none;width:100%}body:has(dialog[open]) main{display:none}.panel{border:0}button{display:none}}
textarea{font:inherit;width:100%;padding:14px;border:1px solid #9aaab2;border-radius:8px;resize:vertical}textarea:focus-visible{outline:4px solid #db9d29;outline-offset:3px}dialog{max-height:92vh;overflow:auto}</style></head><body><header><div class="brand">▤ ECUN <span style="color:#25694c">Fácil</span><small>Librería ECUN S.A.S.</small></div><div class="badge">Versión portátil · Datos de ejemplo</div></header><main id="app"></main><footer class="row between"><span>Hecho para atender con tranquilidad.<br>Los datos se guardan solo en este navegador cuando lo permite. La voz requiere un navegador compatible y puede necesitar internet.</span><button class="small" onclick="resetDemo()">Restablecer demostración</button></footer><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>
const KEY='ecun-facil-v1';
const initial=()=>({books:[{id:'9780307474728',title:'Cien años de soledad',author:'Gabriel García Márquez',price:140000,stock:40},{id:'9788408300000',title:'El último secreto',author:'Dan Brown',price:95000,stock:12},{id:'9780156012195',title:'El principito',author:'Antoine de Saint-Exupéry',price:42000,stock:8},{id:'9788497592208',title:'Don Quijote de la Mancha',author:'Miguel de Cervantes',price:65000,stock:3}],sales:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!Array.isArray(state.books)||!Array.isArray(state.sales))state=initial()}catch{state=initial()}
let cart={},page='home',report='day';const app=document.querySelector('#app'),modal=document.querySelector('#modal');const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Bogota'}).format(new Date(d));const stamp=d=>new Date(d).toLocaleString('es-CO',{timeZone:'America/Bogota'});const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+state.books.find(b=>b.id===id).price*q,0);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('No fue posible guardar en el navegador. Mantén esta página abierta.')}}
let timer;function notify(s){document.querySelector('#toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#toast').textContent='',4500)}
function go(p){page=p;render();window.scrollTo(0,0)}
function heading(title,sub){return `<button class="nav" onclick="go('home')">← Menú principal</button><h1>${title}</h1><p class="muted">${sub}</p>`}
function render(){if(page==='home'){app.innerHTML=`<div class="eyebrow">TU LIBRERÍA, A UN TOQUE</div><h1>¿Qué deseas hacer?</h1><p class="muted">Elige una actividad para comenzar.</p><div class="grid"><button class="tile blue" onclick="go('sale')"><div class="icon" aria-hidden="true">▤</div><div><strong>Realizar venta</strong><span>Agrega libros y confirma el total.</span></div><span>Comenzar →</span></button><button class="tile green" onclick="go('inventory')"><div class="icon" aria-hidden="true">＋</div><div><strong>Agregar a inventario</strong><span>Registra libros y consulta existencias.</span></div><span>Organizar →</span></button><button class="tile orange" onclick="go('reports')"><div class="icon" aria-hidden="true">▥</div><div><strong>Generar reporte</strong><span>Revisa tus ventas y libros disponibles.</span></div><span>Consultar →</span></button></div><div class="notice"><strong>Una demostración paso a paso</strong><br>Registra un libro, realiza una venta y consulta el resultado en los reportes. El escáner es simulado. El dictado puede usar tu micrófono en navegadores compatibles.</div>`}else if(page==='sale')saleView();else if(page==='inventory')inventoryView();else reportsView()}
function saleView(){app.innerHTML=heading('Realizar venta','Agrega los libros, revisa las cantidades y confirma la venta.')+`<div class="two"><section class="panel"><h2>1. Agregar un libro</h2><label for="book">Libro del catálogo</label><select id="book">${state.books.map(b=>`<option value="${esc(b.id)}">${esc(b.title)} · ${b.stock} disponibles</option>`).join('')}</select><div class="actions row"><button class="primary" onclick="addSelected()">＋ Agregar libro</button></div><hr style="border:0;border-top:1px solid #dbe0db;margin:28px 0"><h2>Prueba las ayudas</h2><p class="hint">El escaneo simulado usa el libro seleccionado. El dictado real permite decir el título y la cantidad.</p><div class="row"><button onclick="simulate('scan')">▥ Simular escaneo</button><button onclick="voiceDialog('sale')">♪ Dictar con micrófono</button></div></section><section class="panel"><h2>2. Revisar la venta</h2>${Object.keys(cart).length?Object.entries(cart).map(([id,q])=>{const b=state.books.find(b=>b.id===id);return `<div style="border-bottom:1px solid #dbe0db;padding:16px 0"><strong>${esc(b.title)}</strong><p class="hint">${money(b.price)} por unidad</p><div class="row between"><div class="row"><button aria-label="Quitar una unidad de ${esc(b.title)}" onclick="change('${id}',-1)">−</button><strong>${q}</strong><button aria-label="Agregar una unidad de ${esc(b.title)}" onclick="change('${id}',1)">＋</button></div><strong>${money(q*b.price)}</strong></div></div>`}).join(''):'<p class="empty">Todavía no has agregado libros.</p>'}<p>Total a cobrar</p><p class="total">${money(total())}</p><button class="success" style="width:100%" onclick="reviewSale()" ${Object.keys(cart).length?'':'disabled'}>Revisar y completar venta</button></section></div>`}
function addSelected(){const id=document.querySelector('#book').value;change(id,1);notify('Libro agregado a la venta.')}
function change(id,n){const b=state.books.find(b=>b.id===id);const q=(cart[id]||0)+n;if(q>b.stock){notify('No hay más unidades disponibles.');return}if(q<=0)delete cart[id];else cart[id]=q;const selected=document.querySelector('#book')?.value;saleView();if(selected)document.querySelector('#book').value=selected}
function simulate(kind){const id=document.querySelector('#book').value,b=state.books.find(b=>b.id===id);modal.innerHTML=`<h2>${kind==='scan'?'Escaneo simulado':'Dictado simulado'}</h2><p>${kind==='scan'?'Código de ejemplo reconocido:':'Ejemplo de frase interpretada:'}</p><div class="notice">${kind==='scan'?esc(b.id):'“Agregar una unidad de '+esc(b.title)+'”'}</div><p>${esc(b.title)} · ${money(b.price)}</p><p class="hint">Simulación: no se utilizó un dispositivo real.</p><div class="row"><button class="primary" onclick="modal.close();change('${id}',1)">Confirmar libro</button><button onclick="modal.close()">Cancelar</button></div>`;modal.showModal()}
function reviewSale(){modal.innerHTML=`<h2>Confirmar venta</h2><p>Se descontarán ${Object.values(cart).reduce((a,b)=>a+b,0)} unidades del inventario.</p><p class="total">${money(total())}</p><div class="row"><button class="success" onclick="completeSale()">Confirmar venta</button><button onclick="modal.close()">Volver a revisar</button></div>`;modal.showModal()}
function completeSale(){if(!Object.keys(cart).length)return;for(const [id,q]of Object.entries(cart)){if(q>state.books.find(b=>b.id===id).stock){modal.close();notify('Revisa las existencias.');return}}const sale={id:state.sales.length+1,date:new Date().toISOString(),total:total(),items:Object.entries(cart).map(([id,qty])=>{const b=state.books.find(b=>b.id===id);b.stock-=qty;return {title:b.title,price:b.price,qty}})};state.sales.push(sale);cart={};save();saleView();receipt(sale)}
function receipt(s){modal.innerHTML=`<div style="text-align:center"><div class="eyebrow">VENTA REGISTRADA</div><h2>ECUN Fácil</h2><p>Comprobante de demostración #${s.id}<br><span class="hint">${stamp(s.date)}</span></p></div>${s.items.map(i=>`<p>${i.qty} × ${esc(i.title)}<br><strong>${money(i.qty*i.price)}</strong></p>`).join('')}<hr><p>Total <strong class="total">${money(s.total)}</strong></p><p class="hint">Ejemplo académico. No es una factura fiscal.</p><div class="row no-print"><button class="primary" onclick="window.print()">Imprimir comprobante</button><button onclick="modal.close()">Cerrar</button></div>`;if(!modal.open)modal.showModal()}
function inventoryView(){app.innerHTML=heading('Agregar a inventario','Registra un libro nuevo o suma unidades usando el mismo código.')+`<div class="two"><section class="panel"><h2>Datos del libro</h2><button onclick="voiceDialog('inventory')">♪ Dictar con micrófono</button><p class="hint">Di el título, la cantidad y el precio. Revisa y corrige los datos antes de guardarlos.</p><form id="inventoryForm"><label for="code">Código del libro</label><input id="code" name="code" required maxlength="40" placeholder="Ejemplo: ECUN-005"><label for="title">Título</label><input id="title" name="title" required maxlength="150"><label for="author">Autor (opcional)</label><input id="author" name="author" maxlength="120"><div class="three" style="grid-template-columns:1fr 1fr"><div><label for="price">Precio (COP)</label><input id="price" name="price" type="number" min="1" max="100000000" step="1" required></div><div><label for="qty">Unidades a ingresar</label><input id="qty" name="qty" type="number" min="1" max="100000" step="1" required></div></div><button class="success actions" type="submit">Revisar y guardar libro</button></form></section><section class="panel"><h2>Libros disponibles</h2><p class="hint">${state.books.length} títulos · ${state.books.reduce((s,b)=>s+b.stock,0)} unidades</p>${state.books.map(b=>`<div style="border-bottom:1px solid #dbe0db;padding:18px 0"><strong>${esc(b.title)}</strong><p class="hint">Código: ${esc(b.id)}<br>${money(b.price)} · <strong>${b.stock} unidades</strong></p><button class="small" onclick="restock('${esc(b.id)}')">Sumar unidades</button></div>`).join('')}</section></div>`;document.querySelector('#inventoryForm').onsubmit=reviewBook}
function fillVoice(){document.querySelector('#code').value='ECUN-005';document.querySelector('#title').value='La vorágine';document.querySelector('#author').value='José Eustasio Rivera';document.querySelector('#price').value=38000;document.querySelector('#qty').value=5;notify('Dictado simulado. Revisa los datos antes de guardar.')}
function restock(id){const b=state.books.find(b=>b.id===id);for(const [field,val]of Object.entries({code:b.id,title:b.title,author:b.author,price:b.price,qty:1}))document.getElementById(field).value=val;document.querySelector('#qty').focus()}
let pendingBook;function reviewBook(e){e.preventDefault();const f=new FormData(e.target);const b={id:f.get('code').trim(),title:f.get('title').trim(),author:f.get('author').trim(),price:Number(f.get('price')),stock:Number(f.get('qty'))};if(!/^[A-Za-z0-9_-]{1,40}$/.test(b.id)){notify('Usa letras, números o guiones en el código.');return}if(!b.id||!b.title||!Number.isSafeInteger(b.stock)||b.stock<1||b.stock>100000||!Number.isSafeInteger(b.price)||b.price<1||b.price>100000000){notify('Revisa el código, título, precio y cantidad.');return}const existing=state.books.find(x=>x.id===b.id);if(existing&&existing.title!==b.title){notify('Este código ya existe. Usa su título actual para reponer unidades, o crea otro código.');return}pendingBook=b;modal.innerHTML=`<h2>Confirmar ingreso</h2><p><strong>${esc(b.title)}</strong></p><p>${money(b.price)} por unidad<br>${b.stock} unidades a ingresar</p><p>${existing?'Se sumarán a las '+existing.stock+' unidades existentes.'+(existing.price!==b.price?' El precio del catálogo cambiará de '+money(existing.price)+' a '+money(b.price)+'.':''):'Se registrará como un libro nuevo.'}</p><div class="row"><button class="success" onclick="commitBook()">Guardar libro</button><button onclick="modal.close()">Corregir datos</button></div>`;modal.showModal()}
function commitBook(){if(!pendingBook)return;const b=pendingBook,existing=state.books.find(x=>x.id===b.id);if(existing){existing.stock+=b.stock;existing.price=b.price;existing.author=b.author;}else state.books.push(b);pendingBook=null;save();modal.close();inventoryView();notify('Inventario actualizado.')}
function reportsView(){const today=day(new Date());const sales=state.sales.filter(s=>report==='month'?day(s.date).slice(0,7)===today.slice(0,7):day(s.date)===today);app.innerHTML=heading('Generar reporte','Consulta la información registrada en esta demostración.')+`<div class="row report-tabs no-print"><button aria-pressed="${report==='day'}" onclick="report='day';reportsView()">Ventas del día</button><button aria-pressed="${report==='month'}" onclick="report='month';reportsView()">Ventas del mes</button><button aria-pressed="${report==='stock'}" onclick="report='stock';reportsView()">Inventario actual</button></div><section class="panel"><div class="row between"><h2>${report==='stock'?'Inventario actual':report==='day'?'Ventas de hoy':'Ventas de este mes'}</h2><button class="no-print" onclick="window.print()">Imprimir reporte</button></div><p class="hint">${report==='stock'?'Existencias después de las ventas e ingresos registrados.':`Período: ${report==='day'?today:today.slice(0,7)} · Hora de Colombia. Los totales son ingresos por ventas, no ganancias.`}</p>${report==='stock'?`<div class="stat">${state.books.reduce((s,b)=>s+b.stock,0)} unidades</div><div class="table-wrap"><table><thead><tr><th>Libro</th><th>Precio</th><th>Existencias</th></tr></thead><tbody>${state.books.map(b=>`<tr><td>${esc(b.title)}</td><td>${money(b.price)}</td><td>${b.stock}${b.stock===0?' · Agotado':b.stock<=3?' · Pocas unidades':''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="three"><div><p>Total vendido</p><div class="stat">${money(sales.reduce((s,v)=>s+v.total,0))}</div></div><div><p>Ventas registradas</p><div class="stat">${sales.length}</div></div><div><p>Libros vendidos</p><div class="stat">${sales.reduce((s,v)=>s+v.items.reduce((n,i)=>n+i.qty,0),0)}</div></div></div>${sales.length?`<div class="table-wrap"><table><thead><tr><th>Venta</th><th>Fecha</th><th>Total</th><th>Comprobante</th></tr></thead><tbody>${sales.slice().reverse().map(s=>`<tr><td>#${s.id}</td><td>${stamp(s.date)}</td><td>${money(s.total)}</td><td><button class="small" onclick="receipt(state.sales.find(s=>s.id===${s.id}))">Ver recibo</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No hay ventas en este período. Realiza una venta para ver el reporte.</p>'}`}</section>`}
function resetDemo(){modal.innerHTML='<h2>¿Restablecer demostración?</h2><p>Se borrarán las ventas y los libros que agregaste en este navegador. Volverás al catálogo inicial.</p><div class="row"><button class="danger" onclick="state=initial();cart={};save();modal.close();go(\'home\');notify(\'Demostración restablecida.\')">Sí, restablecer</button><button onclick="modal.close()">Cancelar</button></div>';modal.showModal()}
render();

</script><script>
// Guided Spanish dictation. No records are saved by speech callbacks.
function normalizeVoice(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function voiceNumber(raw){let s=normalizeVoice(raw).replace(/\b(pesos|cop|unidades|unidad)\b/g,'').replace(/\$/g,'').replace(/[.,;]+$/,'').trim();if(/^\d{1,3}([.,]\d{3})+$/.test(s))return Number(s.replace(/[.,]/g,''));if(/^\d+$/.test(s))return Number(s);let parts=s.split(/\s+/);const values={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};let sum=0,group=0,seen=false;for(const w of parts){if(w==='y')continue;if(w==='mil'){sum+=(group||1)*1000;group=0;seen=true}else if(Object.hasOwn(values,w)){group+=values[w];seen=true}else if(/^\d+$/.test(w)){group+=Number(w);seen=true}else return NaN}return seen?sum+group:NaN}
function parseVoice(text,mode){const clean=text.trim();const markers=[...clean.matchAll(/\b(cantidad|precio)\b\s*[:=]?\s*/gi)];const title=clean.slice(0,markers[0]?.index??clean.length).replace(/^\s*t[ií]tulo\s*[:=]?\s*/i,'').replace(/[,;:.\s]+$/,'').trim();let fields={};for(let i=0;i<markers.length;i++){const key=markers[i][1].toLowerCase();if(key in fields)throw Error('Repite cada campo solo una vez: título, cantidad y precio.');fields[key]=clean.slice(markers[i].index+markers[i][0].length,markers[i+1]?.index??clean.length).replace(/[,;:\s]+$/,'')}
const qty=voiceNumber(fields.cantidad||'');const price=voiceNumber(fields.precio||'');if(!title)throw Error('Indica el título antes de la palabra cantidad.');if(!Number.isSafeInteger(qty)||qty<1||qty>100000)throw Error('Indica cantidad seguida de un número entero entre 1 y 100.000.');if(mode==='inventory'&&(!Number.isSafeInteger(price)||price<1||price>100000000))throw Error('Indica precio seguido de un valor entero en pesos. Ejemplo: precio ciento veinte mil.');return {title,qty,price}}
let voiceSession=null,voiceMode='inventory';
function stopVoice(){if(voiceSession){const old=voiceSession;voiceSession=null;old.abort()}}
modal.addEventListener('close',stopVoice);modal.addEventListener('cancel',stopVoice);
function voiceStatus(text){const el=document.querySelector('#voiceStatus');if(el)el.textContent=text}
function voiceDialog(mode){stopVoice();voiceMode=mode;const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);modal.innerHTML=`<h2>Dictado por voz</h2><p>Di el título y luego las palabras ${mode==='inventory'?'“cantidad” y “precio”':'“cantidad”'}.</p><div class="notice">${mode==='inventory'?'“La vorágine, cantidad cinco unidades, precio treinta y ocho mil pesos”':'“Cien años de soledad, cantidad dos unidades”'}</div><p class="hint">El navegador pedirá permiso para usar el micrófono. El audio puede enviarse al servicio de reconocimiento del navegador. ECUN no guarda grabaciones.</p><div class="row"><button id="listen" class="primary" onclick="startVoice()" ${supported?'':'disabled'}>● Iniciar dictado</button><button id="stopListen" onclick="finishVoice()" disabled>Detener</button></div><p id="voiceStatus" role="status" aria-live="polite">${supported?'Listo para escuchar en español.':'Este navegador no ofrece reconocimiento de voz. Prueba en Chrome o escribe el texto abajo.'}</p><label for="voiceText">Texto reconocido · puedes corregirlo</label><textarea id="voiceText" rows="4" placeholder="${mode==='inventory'?'La vorágine, cantidad 5, precio 38000':'Cien años de soledad, cantidad 2'}"></textarea><p class="hint">Puedes escribir o corregir el texto. Al volver a dictar se reemplaza la transcripción. ${mode==='sale'?'Se usa el precio registrado en el catálogo.':''}</p><div class="row"><button id="applyVoice" class="success" onclick="applyVoice()">Revisar datos</button><button onclick="stopVoice();modal.close()">Cancelar</button></div>`;modal.showModal()}
function startVoice(){stopVoice();const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition)return;const rec=new Recognition();voiceSession=rec;rec.lang='es-CO';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;let heard=false,failed=false;const box=document.querySelector('#voiceText');box.readOnly=true;document.querySelector('#listen').disabled=true;document.querySelector('#stopListen').disabled=false;document.querySelector('#applyVoice').disabled=true;rec.onresult=e=>{if(voiceSession!==rec)return;box.value=Array.from(e.results).map(r=>r[0].transcript).join(' ');heard=true;voiceStatus('Voz recibida. Espera a que termine para revisar el texto.')};rec.onerror=e=>{if(voiceSession!==rec)return;failed=true;const messages={'not-allowed':'Permiso de micrófono denegado. Habilítalo en los permisos del sitio y vuelve a intentar.','service-not-allowed':'El servicio de voz no está disponible en este navegador. Prueba en Chrome.','audio-capture':'No se detectó un micrófono disponible. Revisa la conexión.','no-speech':'No se detectó voz. Pulsa Iniciar dictado y habla cerca del micrófono.','network':'No se pudo conectar con el servicio de voz. Revisa internet o escribe el texto.','language-not-supported':'El servicio no admite este idioma. Puedes escribir el texto.'};voiceStatus(messages[e.error]||'El dictado se interrumpió. Puedes reintentarlo o escribir el texto.')};rec.onend=()=>{if(voiceSession!==rec)return;voiceSession=null;box.readOnly=false;document.querySelector('#listen').disabled=false;document.querySelector('#stopListen').disabled=true;document.querySelector('#applyVoice').disabled=false;if(!failed)voiceStatus(heard?'Dictado terminado. Corrige el texto y pulsa Revisar datos.':'No se recibió texto. Puedes dictar de nuevo o escribirlo.')};try{rec.start();voiceStatus('Escuchando… Habla ahora.')}catch{rec.onend();voiceStatus('No se pudo iniciar el micrófono. Revisa los permisos o escribe el texto.')}}
function finishVoice(){if(voiceSession){voiceStatus('Terminando dictado…');voiceSession.stop()}}
function applyVoice(){let data;try{data=parseVoice(document.querySelector('#voiceText').value,voiceMode)}catch(e){voiceStatus(e.message);return}stopVoice();if(voiceMode==='inventory'){modal.close();const match=state.books.find(b=>normalizeVoice(b.title)===normalizeVoice(data.title));document.querySelector('#code').value=match?.id||'ECUN-'+Date.now().toString(36).toUpperCase();document.querySelector('#title').value=match?.title||data.title;document.querySelector('#author').value=match?.author||'';document.querySelector('#qty').value=data.qty;document.querySelector('#price').value=data.price;notify(match?'Datos preparados. Revisa cantidad y precio; cualquier cambio de precio se mostrará antes de guardar.':'Datos preparados. Puedes editarlos antes de guardar.');document.querySelector('#title').focus()}else{const match=state.books.find(b=>normalizeVoice(b.title)===normalizeVoice(data.title));modal.innerHTML=`<h2>Revisar libro y cantidad</h2><p>Título reconocido: <strong>${esc(data.title)}</strong></p><label for="voiceBook">Libro del catálogo</label><select id="voiceBook"><option value="">Selecciona el libro correcto</option>${state.books.map(b=>`<option value="${esc(b.id)}" ${b===match?'selected':''}>${esc(b.title)} · ${money(b.price)} · ${b.stock} disponibles</option>`).join('')}</select><label for="voiceQty">Cantidad · puedes corregirla</label><input id="voiceQty" type="number" min="1" max="100000" step="1" value="${data.qty}"><p class="hint">El precio es el registrado en el catálogo. Agregar al carrito todavía no completa la venta.</p><p id="voiceStatus" role="status">${match?'Revisa los datos antes de agregar.':'No hubo coincidencia exacta. Selecciona el libro correcto.'}</p><div class="row"><button class="success" onclick="confirmVoiceCart()">Agregar a la venta</button><button onclick="modal.close()">Cancelar</button></div>`}}
function confirmVoiceCart(){const id=document.querySelector('#voiceBook').value;const qty=Number(document.querySelector('#voiceQty').value);const book=state.books.find(b=>b.id===id);if(!book||!Number.isSafeInteger(qty)||qty<1||qty>100000){voiceStatus('Selecciona un libro y una cantidad entera válida.');return}if((cart[id]||0)+qty>book.stock){voiceStatus('La cantidad supera las existencias. Corrígela antes de agregar.');return}cart[id]=(cart[id]||0)+qty;modal.close();saleView();notify('Libro agregado. Revisa la venta antes de confirmarla.')}

</script></body></html>
